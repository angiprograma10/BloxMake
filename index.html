<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABX Build • IA para Roblox Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
        * { box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 0; min-height: 100vh; }
        .header { background: #1e2937; border-bottom: 1px solid #334155; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand h1 { margin: 0; font-size: 24px; font-family: 'Space Grotesk', sans-serif; }
        .btn { padding: 10px 18px; border-radius: 10px; border: none; cursor: pointer; font-weight: 500; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-secondary { background: #334155; color: #e2e8f0; }
        #connect-prompt, #chat-area { max-width: 800px; margin: 40px auto; padding: 24px; }
        #connect-prompt { background: #1e2937; border-radius: 16px; text-align: center; }
        #chat-messages { background: #0f172a; border: 1px solid #334155; border-radius: 16px; height: 480px; overflow-y: auto; padding: 20px; margin-bottom: 16px; }
        .user-message { background: #3b82f6; color: white; padding: 12px 16px; border-radius: 16px 16px 4px 16px; margin: 8px 0; max-width: 80%; margin-left: auto; }
        .ai-message { background: #1e2937; border: 1px solid #334155; padding: 12px 16px; border-radius: 16px 16px 16px 4px; margin: 8px 0; max-width: 80%; }
        textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px; color: #e2e8f0; resize: none; }
        #connect-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        #connect-modal.show { display: flex; }
        #connect-modal > div { background: #1e2937; padding: 28px; border-radius: 16px; width: 100%; max-width: 400px; }
        #connection-code { width: 100%; font-size: 22px; text-align: center; letter-spacing: 8px; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; margin: 12px 0; }
    </style>
</head>
<body>
    <header class="header">
        <div class="brand">
            <i class="fa-solid fa-cubes" style="font-size: 28px; color: #60a5fa;"></i>
            <div>
                <h1>ABX Build</h1>
                <small style="color: #94a3b8;">Creado por Angiblox</small>
            </div>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button onclick="showConnectModal()" class="btn btn-secondary" id="plugin-status-text">Plugin Desconectado</button>
            <button onclick="showLoginModal()" class="btn btn-secondary" id="user-info">Iniciar sesión</button>
        </div>
    </header>

    <div id="connect-prompt">
        <i class="fa-solid fa-plug" style="font-size: 40px; color: #f87171;"></i>
        <h2>Conecta tu Plugin</h2>
        <p>Ingresa el código de 5 dígitos del plugin de Roblox Studio.</p>
        <button onclick="showConnectModal()" class="btn btn-primary">Conectar Plugin</button>
    </div>

    <div id="chat-area" style="display: none;">
        <div id="chat-messages"></div>
        <div style="display: flex; gap: 10px;">
            <textarea id="user-input" rows="2" placeholder="Dile a ABX Build qué quieres crear..."></textarea>
            <button onclick="sendMessage()" class="btn btn-primary" style="align-self: flex-end;">Enviar</button>
        </div>
    </div>

    <div id="connect-modal">
        <div>
            <h3>Conectar Plugin</h3>
            <p>Código de 5 dígitos:</p>
            <input type="text" id="connection-code" maxlength="5" placeholder="00000">
            <div style="display: flex; gap: 10px; margin-top: 12px;">
                <button onclick="connectWithCode()" class="btn btn-primary" style="flex:1;">Conectar</button>
                <button onclick="hideConnectModal()" class="btn btn-secondary" style="flex:1;">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://abx-build-backend.onrender.com";
        let isPluginConnected = false;
        let currentConnectionCode = null;
        let selectedModelId = "gemini-3.5-flash-lite";
        let chatHistory = [];

        function showConnectModal() {
            document.getElementById('connect-modal').classList.add('show');
            document.getElementById('connection-code').focus();
        }
        function hideConnectModal() {
            document.getElementById('connect-modal').classList.remove('show');
        }
        function showLoginModal() {
            const name = prompt("Tu nombre:");
            if (name) document.getElementById('user-info').textContent = name;
        }

        function connectWithCode() {
            const code = document.getElementById('connection-code').value.trim();
            if (code.length !== 5 || isNaN(code)) {
                alert("Código de 5 números requerido.");
                return;
            }
            fetch(BACKEND_URL + "/connect", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ code })
            })
            .then(r => r.json())
            .then(data => {
                if (data.ok) {
                    isPluginConnected = true;
                    currentConnectionCode = code;
                    document.getElementById('plugin-status-text').textContent = "Plugin Conectado ✓";
                    document.getElementById('plugin-status-text').style.color = "#4ade80";
                    hideConnectModal();
                    document.getElementById('connect-prompt').style.display = 'none';
                    document.getElementById('chat-area').style.display = 'block';
                    addMessage('ai', 'Conectado. ¿Qué quieres crear en Roblox Studio?');
                } else {
                    alert("Código no encontrado. Genera uno en el plugin.");
                }
            })
            .catch(() => alert("Error de conexión con el backend."));
        }

        function addMessage(role, text) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = role === 'user' ? 'user-message' : 'ai-message';
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text || !isPluginConnected) return;
            addMessage('user', text);
            input.value = '';
            chatHistory.push({ role: 'user', text });

            try {
                const res = await fetch(BACKEND_URL + '/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code: currentConnectionCode,
                        message: text,
                        model: selectedModelId,
                        history: chatHistory.slice(-8)
                    })
                });
                const data = await res.json();
                if (data.reply) {
                    addMessage('ai', data.reply);
                    chatHistory.push({ role: 'model', text: data.reply });
                }
                if (data.action) {
                    await fetch(BACKEND_URL + '/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code: currentConnectionCode, script: JSON.stringify(data.action) })
                    });
                    addMessage('ai', 'Acción enviada al plugin. Revisa Roblox Studio.');
                }
            } catch (e) {
                addMessage('ai', 'Error al contactar el backend.');
            }
        }

        document.getElementById('user-input').addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
    </script>
</body>
</html>
